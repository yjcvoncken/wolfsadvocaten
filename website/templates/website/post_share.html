{% load localization %}
{% with share_url=request.build_absolute_uri title=post|localized:"title" %}
<div class="post-share" role="group" aria-label="{% tr 'Share this article' %}">
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url|urlencode:'' }}" target="_blank" rel="noopener noreferrer" aria-label="{% tr 'Share on Facebook' %}" title="{% tr 'Share on Facebook' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 21v-8h3l.5-4H14V7c0-1.2.3-2 2-2h2V1.4A24 24 0 0 0 15 1c-3 0-5 1.8-5 5v3H7v4h3v8z"/></svg></a>
  <a href="https://x.com/intent/tweet?url={{ share_url|urlencode:'' }}&amp;text={{ title|urlencode:'' }}" target="_blank" rel="noopener noreferrer" aria-label="{% tr 'Share on X' %}" title="{% tr 'Share on X' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22H17l-4.9-7.4L5.6 22H2.4l8.2-9.5L2.8 2h6.4l4.4 6.7L18.9 2zm-1.1 18h1.7L8.2 3.9H6.4z"/></svg></a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url|urlencode:'' }}" target="_blank" rel="noopener noreferrer" aria-label="{% tr 'Share on LinkedIn' %}" title="{% tr 'Share on LinkedIn' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4v13H3zm2-6a2.3 2.3 0 1 0 0 4.6A2.3 2.3 0 0 0 5 2zm5 6h4v1.8c.6-1 1.7-2.1 3.7-2.1 4 0 4.3 2.6 4.3 6V21h-4v-6.5c0-1.6-.1-3-1.9-3-1.9 0-2.1 1.5-2.1 2.9V21h-4z"/></svg></a>
  <button type="button" data-copy-link="{{ share_url }}" data-copied="{% tr 'Link copied' %}" data-copy-prompt="{% tr 'Copy this link:' %}" aria-label="{% tr 'Copy link' %}" title="{% tr 'Copy link' %}" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m10 13 4-4M8 15l-1 1a3 3 0 0 1-4-4l4-4a3 3 0 0 1 4 0m2 3 1-1a3 3 0 0 1 4 4l-4 4a3 3 0 0 1-4 0" transform="rotate(-90 12 12)"/></g></svg></button>
  <span class="post-share-status" role="status" aria-live="polite"></span>
</div>
{% endwith %}
