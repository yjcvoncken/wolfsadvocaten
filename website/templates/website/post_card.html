{% load localization %}<article class="post-card"><a href="{{ post.get_absolute_url }}" class="post-image">{% if post.image %}<img src="{{ post.image.url }}" alt="" loading="lazy">{% endif %}</a><div class="post-body"><span>{{ post.published_at|date:'M d, Y' }}</span><h3><a href="{{ post.get_absolute_url }}">{{ post|localized:"title" }}</a></h3><p>{% with translated_body=post|localized:"body" %}{{ post|localized:"excerpt"|default:translated_body|truncatewords:30 }}{% endwith %}</p></div></article>
